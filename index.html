<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwiftDelivery Cargo</title>
  <meta name="description"
    content="Track your shipment in real-time with SwiftDelivery Cargo. Fast, reliable cargo tracking for your packages and deliveries." />
  <meta name="keywords" content="shipment tracking, cargo tracking, package delivery, SwiftDelivery Cargo" />

  <!-- Open Graph / social sharing -->
  <meta property="og:title" content="SwiftDelivery Cargo" />
  <meta property="og:description" content="Track your shipment in real-time with SwiftDelivery Cargo." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://swiftdeliverycargo.com" />
  <meta property="og:image" content="https://swiftdeliverycargo.com/og-image.jpg" />
  <meta property="og:site_name" content="SwiftDelivery Cargo" />

  <link rel="canonical" href="https://swiftdeliverycargo.com" />

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Structured data: tells Google this domain IS the SwiftDelivery Cargo brand -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "SwiftDelivery Cargo",
    "alternateName": "SwiftDelivery Cargo",
    "url": "https://swiftdeliverycargo.com",
    "logo": "https://swiftdeliverycargo.com/favicon-32x32.png",
    "description": "Track your shipment in real-time with SwiftDelivery Cargo. Fast, reliable cargo tracking for packages, luggage, vehicles, and freight anywhere in the world."
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
